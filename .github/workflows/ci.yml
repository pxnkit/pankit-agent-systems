name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build the grounded corpus
        run: npm run build:corpus

      - name: Verify generated corpus is current
        run: git diff --exit-code -- generated

      - name: Verify content policy
        run: npm run verify:content

      - name: Verify links
        run: npm run verify:links

      - name: Build OpenNext Worker
        run: npm run build:worker
        env:
          AI_MODE: mock
          NEXT_PUBLIC_SITE_URL: http://localhost:4173

      - name: Run Chromium end-to-end tests against the Workers runtime
        run: npm run test:e2e -- --project=chromium
